<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="890" viewBox="0 0 1040 890" aria-labelledby="title desc"><title id="title">Pequeverso backoffice: guarded access and private aggregate operations</title><desc id="desc">Invited operators authenticate through Better Auth OAuth. Server-side session and role guards use the separate PostgreSQL identity database. A bounded server adapter reads private API summaries and optional telemetry, without prompts or buyer data. Shared observability is optional and operator-owned.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b8197"/></marker></defs><rect width="1040" height="890" rx="24" fill="#fffaf4"/>
<text x="32" y="44" fill="#16283f" font-family="Arial, sans-serif" font-size="30" font-weight="700">Pequeverso · Private backoffice</text>
<text x="32" y="75" fill="#41576d" font-family="Arial, sans-serif" font-size="17" font-weight="400">Guarded administration · useful aggregates, never conversation content</text>
<rect x="32" y="108" width="976" height="80" rx="16" fill="#ffffff" stroke="#cbd7e2"/>
<rect x="48" y="125" width="4" height="23" rx="2" fill="#00776c"/>
<text x="62" y="143" fill="#16283f" font-family="Arial, sans-serif" font-size="20" font-weight="700">Owner or invited operator</text>
<text x="52" y="172" fill="#41576d" font-family="Arial, sans-serif" font-size="16" font-weight="400">Private application · no public sign-up or domain-based admission</text>
<polyline points="269,188 269,236" fill="none" stroke="#6b8197" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="236" width="475" height="112" rx="16" fill="#ffffff" stroke="#cbd7e2"/>
<rect x="48" y="253" width="4" height="23" rx="2" fill="#00776c"/>
<text x="62" y="271" fill="#16283f" font-family="Arial, sans-serif" font-size="20" font-weight="700">Server access boundary</text>
<text x="52" y="300" fill="#41576d" font-family="Arial, sans-serif" font-size="16" font-weight="400">Better Auth · Google / GitHub OAuth</text>
<text x="52" y="324" fill="#41576d" font-family="Arial, sans-serif" font-size="16" font-weight="400">Verified identity · session and role checks</text>
<rect x="533" y="236" width="475" height="112" rx="16" fill="#ffffff" stroke="#cbd7e2"/>
<rect x="549" y="253" width="4" height="23" rx="2" fill="#00776c"/>
<text x="563" y="271" fill="#16283f" font-family="Arial, sans-serif" font-size="20" font-weight="700">PostgreSQL 18 · private IAM</text>
<text x="553" y="300" fill="#41576d" font-family="Arial, sans-serif" font-size="16" font-weight="400">Identity, sessions and invitations</text>
<text x="553" y="324" fill="#41576d" font-family="Arial, sans-serif" font-size="16" font-weight="400">Separate from the assistant’s data</text>
<polyline points="507,292 532,292" fill="none" stroke="#6b8197" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="269,348 269,400" fill="none" stroke="#6b8197" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="400" width="976" height="112" rx="16" fill="#ffffff" stroke="#cbd7e2"/>
<rect x="48" y="417" width="4" height="23" rx="2" fill="#00776c"/>
<text x="62" y="435" fill="#16283f" font-family="Arial, sans-serif" font-size="20" font-weight="700">Operations dashboard</text>
<text x="52" y="464" fill="#41576d" font-family="Arial, sans-serif" font-size="16" font-weight="400">Health, catalog freshness, runs, latency, tokens and spend</text>
<text x="52" y="488" fill="#41576d" font-family="Arial, sans-serif" font-size="16" font-weight="400">Unknown values stay unavailable; fixture readings are labelled synthetic</text>
<polyline points="269,512 269,562" fill="none" stroke="#6b8197" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="562" width="475" height="112" rx="16" fill="#ffffff" stroke="#cbd7e2"/>
<rect x="48" y="579" width="4" height="23" rx="2" fill="#00776c"/>
<text x="62" y="597" fill="#16283f" font-family="Arial, sans-serif" font-size="20" font-weight="700">Bounded server adapter</text>
<text x="52" y="626" fill="#41576d" font-family="Arial, sans-serif" font-size="16" font-weight="400">Private bearer stays server-side</text>
<text x="52" y="650" fill="#41576d" font-family="Arial, sans-serif" font-size="16" font-weight="400">Validate payloads · safe unavailable state</text>
<rect x="533" y="562" width="475" height="112" rx="16" fill="#ffffff" stroke="#cbd7e2"/>
<rect x="549" y="579" width="4" height="23" rx="2" fill="#00776c"/>
<text x="563" y="597" fill="#16283f" font-family="Arial, sans-serif" font-size="20" font-weight="700">Assistant API · private ops</text>
<text x="553" y="626" fill="#41576d" font-family="Arial, sans-serif" font-size="16" font-weight="400">Summary rev. 1.2 · optional telemetry rev. 1.0</text>
<text x="553" y="650" fill="#41576d" font-family="Arial, sans-serif" font-size="16" font-weight="400">Aggregates, no prompts or buyer data</text>
<polyline points="507,618 532,618" fill="none" stroke="#6b8197" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1008,456 1024,456 1024,780 1008,780" fill="none" stroke="#6b8197" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="32" y="728" width="976" height="104" rx="16" fill="#ffffff" stroke="#6b8197" stroke-dasharray="6 5"/>
<rect x="48" y="745" width="4" height="23" rx="2" fill="#00776c"/>
<text x="62" y="763" fill="#16283f" font-family="Arial, sans-serif" font-size="20" font-weight="700">vps-ops · optional private observability</text>
<text x="52" y="792" fill="#41576d" font-family="Arial, sans-serif" font-size="16" font-weight="400">OTLP / metrics bearer → operator-owned Prometheus and Grafana</text>
<text x="52" y="816" fill="#41576d" font-family="Arial, sans-serif" font-size="16" font-weight="400">Complements the dashboard; no monitoring stack is deployed here</text>
<text x="32" y="866" fill="#41576d" font-family="Arial, sans-serif" font-size="15" font-weight="400">Solid: guarded application or storage path · Dashed: optional operator integration</text>
</svg>
