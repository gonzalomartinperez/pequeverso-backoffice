# Nightly browser suite: every Playwright project (chromium, firefox, webkit, mobile-webkit and
# mobile-chromium/Pixel 7) against the production build, disposable PostgreSQL, fake identity
# provider and SYNTHETIC ops data. It is NOT a ci-gate prerequisite (pull requests run the
# chromium + mobile-webkit set in ci.yml). `schedule` runs only from the default branch (main,
# frozen until M7): the pull_request trigger, limited to this workflow and the browser suite
# config, lets the PR prove it until the schedule activates.
name: browser-nightly

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/browser-nightly.yml"
      - "playwright.config.ts"
      - "tests/browser/**"
      - "scripts/ci-postgres.sh"
      - "scripts/backoffice-stack.ts"

permissions: {}

concurrency:
  group: browser-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-all:
    name: Browser tests, all engines
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      TEST_DATABASE_URL: postgres://backoffice:ci-only@127.0.0.1:5432/backoffice_test
      # A pass on retry fails the nightly run: flaky tests must be fixed or quarantined.
      PW_FAIL_ON_FLAKY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Start a disposable PostgreSQL (test-only credentials)
        run: scripts/ci-postgres.sh
      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Backoffice suite, every project
        run: npm run test:browser
      - name: Upload the HTML report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-nightly
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore
