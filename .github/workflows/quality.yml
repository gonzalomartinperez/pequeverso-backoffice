name: Quality

# Every pull request into develop/main and every push to develop/main. Independent jobs run in
# parallel; `Required checks` (the ruleset's required status) fails unless every job succeeded.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: quality-${{ github.ref }}
  # Supersede older runs of the same pull request; never cancel a branch push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PLAYWRIGHT_SKIP_BROWSER_GC: "1"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record checked source identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'source_sha=%s\nworkflow_sha=%s\nrun_id=%s\npr_head_sha=%s\npr_base_sha=%s\n' \
            "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$PR_HEAD_SHA" "$PR_BASE_SHA"
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          pyflakes: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
          min-severity: low

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record checked source identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'source_sha=%s\nworkflow_sha=%s\nrun_id=%s\npr_head_sha=%s\npr_base_sha=%s\n' \
            "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$PR_HEAD_SHA" "$PR_BASE_SHA"
      - name: gitleaks over the full history (redacted; fails on zero commits scanned)
        run: .github/scripts/secret-scan.sh

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record checked source identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'source_sha=%s\nworkflow_sha=%s\nrun_id=%s\npr_head_sha=%s\npr_base_sha=%s\n' \
            "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$PR_HEAD_SHA" "$PR_BASE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Fresh clone to green inner loop in one command: npm ci --ignore-scripts, then check:fast
      # (Biome lint and format, TypeScript 7 with route types, unit/contract/architecture tests).
      - name: One-command setup (install and check:fast)
        run: npm run setup
      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate
      - name: Unused files, exports and dependencies (knip)
        run: npm run knip
      - name: Public-file scan, documentation links and skills
        run: npm run security:check && npm run docs:check && npm run skills:check

  database:
    # Mandatory database-backed migrations, IAM, invitations and revocation suite.
    name: Database tests
    needs: [static]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record checked source identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'source_sha=%s\nworkflow_sha=%s\nrun_id=%s\npr_head_sha=%s\npr_base_sha=%s\n' \
            "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$PR_HEAD_SHA" "$PR_BASE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start a disposable PostgreSQL (test-only credentials)
        run: |
          docker run -d --name postgres -e POSTGRES_USER=backoffice -e POSTGRES_PASSWORD=ci-only \
            -e POSTGRES_DB=backoffice_test -p 127.0.0.1:5432:5432 --tmpfs /var/lib/postgresql \
            postgres:18.6-trixie@sha256:885953109528ad3dfc90362b1a6f50a78620b5315be19f187753d267e484dc5b
          for _ in $(seq 1 30); do
            docker exec postgres pg_isready -U backoffice -d backoffice_test >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs postgres; exit 1
      - name: Database tests
        env:
          DATABASE_URL: postgres://backoffice:ci-only@127.0.0.1:5432/backoffice_test
        run: npm run test:db

  container:
    name: Container verification
    needs: [static]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record checked source identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'source_sha=%s\nworkflow_sha=%s\nrun_id=%s\npr_head_sha=%s\npr_base_sha=%s\n' \
            "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$PR_HEAD_SHA" "$PR_BASE_SHA"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build metadata (validated version, commit time)
        id: meta
        run: |
          version="$(jq -r .version package.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "invalid version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Build the app and PostgreSQL IAM images (docker-bake.hcl)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          SERVICE_REVISION: ${{ github.sha }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          source: .
          files: docker-bake.hcl
          load: true
          # The PostgreSQL artifact stays uncached so pinned Debian packages are re-resolved each run.
          set: |
            app.cache-from=type=gha,scope=web-node24-amd64
            app.cache-to=type=gha,mode=max,scope=web-node24-amd64
      - name: Check image metadata and the PostgreSQL health check
        env:
          SERVICE_REVISION: ${{ github.sha }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: scripts/check-image-metadata.sh pequeverso-backoffice:rc pequeverso-backoffice-postgres:rc
      - name: Dockerfile lint, app (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: infra/docker/app/Dockerfile
          failure-threshold: warning
      - name: Dockerfile lint, PostgreSQL artifact (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: infra/docker/postgres/Dockerfile
          failure-threshold: warning
      - name: CIS image checks (dockle, digest-pinned, no Docker socket)
        run: |
          docker save pequeverso-backoffice:rc -o "$RUNNER_TEMP/app-image.tar"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            -v "$RUNNER_TEMP/app-image.tar:/app-image.tar:ro" \
            goodwithtech/dockle:v0.4.15@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9 \
            --input /app-image.tar --exit-code 1 --exit-level warn
          rm "$RUNNER_TEMP/app-image.tar"
      - name: Image structure (container-structure-test, checksum-verified)
        env:
          CST_VERSION: v1.22.1
          CST_SHA256: fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca
        run: |
          curl -fsSL --retry 3 -o /tmp/cst "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}/container-structure-test-linux-amd64"
          echo "${CST_SHA256}  /tmp/cst" | sha256sum -c -
          chmod +x /tmp/cst
          /tmp/cst test --image pequeverso-backoffice:rc --config infra/docker/app/structure-test.yaml
      - name: Vulnerability scan, app image (Grype, fixable high or critical fails)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: pequeverso-backoffice:rc
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Vulnerability scan, PostgreSQL artifact (Grype, fixable high or critical fails)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: pequeverso-backoffice-postgres:rc
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: SBOM of the app image (Syft, CycloneDX JSON artifact)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: pequeverso-backoffice:rc
          format: cyclonedx-json
          output-file: sbom-pequeverso-backoffice.cdx.json
          artifact-name: sbom-pequeverso-backoffice.cdx.json
          upload-artifact-retention: 14
          upload-release-assets: false
      - name: Smoke the exact image hardened (fail-closed, migrations, readiness, headers)
        run: scripts/smoke-image.sh pequeverso-backoffice:rc
      - name: Compare bounded IAM settings and restore with the exact app image
        run: scripts/smoke-postgres.sh pequeverso-backoffice:rc /tmp/postgres-receipt pequeverso-backoffice-postgres:rc

  browser:
    # Production build + real PostgreSQL + the real Better Auth callback against the local fake
    # identity provider + SYNTHETIC ops data. Proves access rules, rendering and accessibility in
    # all engines; it does not prove Google/GitHub OAuth.
    name: Browser tests
    needs: [static]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record checked source identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'source_sha=%s\nworkflow_sha=%s\nrun_id=%s\npr_head_sha=%s\npr_base_sha=%s\n' \
            "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$PR_HEAD_SHA" "$PR_BASE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start a disposable PostgreSQL (test-only credentials)
        run: |
          docker run -d --name postgres -e POSTGRES_USER=backoffice -e POSTGRES_PASSWORD=ci-only \
            -e POSTGRES_DB=backoffice_test -p 127.0.0.1:5432:5432 --tmpfs /var/lib/postgresql \
            postgres:18.6-trixie@sha256:885953109528ad3dfc90362b1a6f50a78620b5315be19f187753d267e484dc5b
          for _ in $(seq 1 30); do
            docker exec postgres pg_isready -U backoffice -d backoffice_test >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs postgres; exit 1
      - name: Production build
        run: npm run build
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-all
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit
      - name: Install browser system dependencies
        run: npx playwright install-deps chromium firefox webkit
      - name: Backoffice suite, all engines
        run: npm run test:browser
        env:
          TEST_DATABASE_URL: postgres://backoffice:ci-only@127.0.0.1:5432/backoffice_test
  checks:
    name: Required checks
    if: always()
    needs: [workflows, secrets, static, database, container, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fail unless every job succeeded
        env:
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          set -eu
          test "$WORKFLOWS_RESULT" = success
          test "$SECRETS_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$CONTAINER_RESULT" = success
          test "$BROWSER_RESULT" = success
