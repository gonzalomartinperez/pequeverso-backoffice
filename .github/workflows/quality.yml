name: Quality

# Every pull request into develop/main and every push to develop. Independent jobs run in
# parallel; `Required checks` (the ruleset's required status) fails unless every job succeeded.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: quality-${{ github.ref }}
  # Supersede older runs of the same pull request; never cancel a push to develop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          pyflakes: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
          min-severity: low

  secrets:
    name: Secret scan (history)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the full history (redacted; fails on zero commits scanned)
        run: .github/scripts/secret-scan.sh

  static:
    name: Static checks, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate
      - name: Lint and format (Biome)
        run: npm run lint
      - name: Type-check with TypeScript 7 (route types included)
        run: npm run typecheck
      - name: Contract snapshot, unit tests and architecture boundaries
        run: npm test
      - name: Public-file scan, documentation links and skills
        run: npm run security:check && npm run docs:check && npm run skills:check

  database:
    # Runs the database-backed suite (migrations, IAM, invitations, revocation) when the
    # repository defines `npm run test:db`; otherwise it records that no such suite exists yet.
    name: Database suite (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect the suite
        id: suite
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.["test:db"] ? 0 : 1)'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No test:db script in package.json; nothing to run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.suite.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.suite.outputs.present == 'true'
        run: npm ci --no-audit --no-fund
      - name: Start a disposable PostgreSQL (test-only credentials)
        if: steps.suite.outputs.present == 'true'
        run: |
          docker run -d --name postgres -e POSTGRES_USER=backoffice -e POSTGRES_PASSWORD=ci-only \
            -e POSTGRES_DB=backoffice_test -p 127.0.0.1:5432:5432 --tmpfs /var/lib/postgresql \
            postgres:18.6-trixie@sha256:885953109528ad3dfc90362b1a6f50a78620b5315be19f187753d267e484dc5b
          for _ in $(seq 1 30); do
            docker exec postgres pg_isready -U backoffice -d backoffice_test >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs postgres; exit 1
      - name: Database tests
        if: steps.suite.outputs.present == 'true'
        env:
          DATABASE_URL: postgres://backoffice:ci-only@127.0.0.1:5432/backoffice_test
        run: npm run test:db

  image:
    name: Production image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/app/Dockerfile
          load: true
          tags: pequeverso-backoffice:rc
          cache-from: type=gha,scope=web-node24-amd64
          cache-to: type=gha,mode=max,scope=web-node24-amd64
      - name: Smoke the exact image hardened (fail-closed, migrations, readiness, headers)
        run: scripts/smoke-image.sh pequeverso-backoffice:rc
      - name: Build the pinned non-root PostgreSQL IAM artifact
        run: docker build -f infra/docker/postgres/Dockerfile --build-arg SERVICE_REVISION="$GITHUB_SHA" -t pequeverso-backoffice-postgres:rc .
      - name: Compare bounded IAM settings and restore with the exact app image
        run: scripts/smoke-postgres.sh pequeverso-backoffice:rc /tmp/postgres-receipt pequeverso-backoffice-postgres:rc

  backoffice:
    # Production build + real PostgreSQL + the real Better Auth callback against the local fake
    # identity provider + SYNTHETIC ops data. Proves access rules, rendering and accessibility in
    # all engines; it does not prove Google/GitHub OAuth.
    name: Backoffice browser suite (PostgreSQL, fake IdP)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start a disposable PostgreSQL (test-only credentials)
        run: |
          docker run -d --name postgres -e POSTGRES_USER=backoffice -e POSTGRES_PASSWORD=ci-only \
            -e POSTGRES_DB=backoffice_test -p 127.0.0.1:5432:5432 --tmpfs /var/lib/postgresql \
            postgres:18.6-trixie@sha256:885953109528ad3dfc90362b1a6f50a78620b5315be19f187753d267e484dc5b
          for _ in $(seq 1 30); do
            docker exec postgres pg_isready -U backoffice -d backoffice_test >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs postgres; exit 1
      - name: Production build
        run: npm run build
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-all
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit
      - name: Install browser system dependencies
        run: npx playwright install-deps chromium firefox webkit
      - name: Backoffice suite, all engines
        run: npm run test:browser
        env:
          TEST_DATABASE_URL: postgres://backoffice:ci-only@127.0.0.1:5432/backoffice_test
  checks:
    name: Required checks
    if: always()
    needs: [workflows, secrets, static, database, image, backoffice]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || { echo "job result: $result"; exit 1; }; done
