# Nightly full mutation run on the scoped modules (ADR 0018, docs/master-plan/testing.md section 1).
# NOT a ci-gate prerequisite: it publishes the report and fails when the global score drops below
# quality/ratchets/mutation.json. `schedule` runs only from the default branch (main, frozen until
# M7): the pull_request trigger, limited to this workflow file, lets the PR prove it
# until the schedule activates. Budget: 60 minutes.
name: mutation-nightly

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mutation-nightly.yml"

permissions: {}

concurrency:
  group: mutation-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation (full, scoped modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full mutation run (fresh, no incremental file)
        timeout-minutes: 50
        run: npm run test:mutation
      - name: Global score against quality/ratchets/mutation.json (nothing is updated automatically)
        run: node scripts/mutation-gate.ts --global
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ github.run_id }}
          path: reports/mutation/mutation.json
          retention-days: 30
          if-no-files-found: warn
