# Dependency updates (docs/dependencies.md). One weekly PR for every ecosystem, targeting develop.
# Security updates are disabled in repository settings; alerts stay on.
version: 2
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    target-branch: develop
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    ignore:
      # Node typings follow the Node LTS line in .nvmrc (24.x).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directories:
      - /infra/docker/app
      - /infra/docker/postgres
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      # The runtime follows the Node LTS line in .nvmrc and package.json engines (24.x); moving to a
      # new major is a deliberate migration, not a routine update.
      - dependency-name: node
        update-types: [version-update:semver-major]
